name: CI/CD Kotlin Spring Boot

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    name: Build, Test y Seguridad
    runs_on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/*.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x rotompediabackend/gradlew

      - name: Compilar y ejecutar pruebas
        working-directory: rotompediabackend
        run: ./gradlew clean test --no-daemon

      - name: Ejecutar análisis de seguridad con Snyk
        uses: snyk/actions/setup@v3
        with:
          version: '1.1042.0'

      - name: Escanear dependencias con Snyk
        working-directory: rotompediabackend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high

  docker-build:
    name: Build Docker image
    runs_on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: rotompediabackend
        run: docker build -t rotompediabackend:latest .
