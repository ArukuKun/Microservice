name: CI/CD Kotlin Spring Boot

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rotompediabackend

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Obligatorio para el análisis completo de SonarCloud

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permisos de ejecución a gradlew
      run: chmod +x ./gradlew

    - name: Construir y probar con Gradle (Build & Test)
      run: ./gradlew build

    - name: Análisis de código con SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./gradlew sonar

    - name: Escaneo de seguridad con Snyk
      uses: snyk/actions/setup@master
    - name: Ejecutar Snyk para testear dependencias
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: snyk test --all-projects
      continue-on-error: false

    - name: Construir imagen Docker
      run: docker build -t rotompediabackend:latest .

    - name: Despliegue simulado y Orquestación
      run: docker-compose up -d
      
    - name: Verificar estado de los contenedores
      run: docker ps